<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dots &amp; Boxes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Dots &amp; Boxes</h1>

    <div class="controls">
      <label>Grid
        <select id="size">
          <option value="3">3 × 3</option>
          <option value="4" selected>4 × 4</option>
          <option value="5">5 × 5</option>
          <option value="6">6 × 6</option>
        </select>
      </label>
      <label>Mode
        <select id="mode">
          <option value="cpu">vs Computer</option>
          <option value="pvp">2 Players (same device)</option>
          <option value="online">Online multiplayer</option>
        </select>
      </label>
      <button id="restart" type="button">New game</button>
      <button id="mute" type="button" aria-label="Mute music" aria-pressed="false">Play/Mute Music</button>
    </div>
    <section id="onlinePanel" hidden>
      <label for="roomCode">Room code</label>
      <input
        id="roomCode"
        type="text"
        maxlength="20"
        placeholder="Enter room code"
      >

      <button id="createRoom" type="button">Create room</button>
      <button id="joinRoom" type="button">Join room</button>

      <p id="onlineStatus" aria-live="polite">
        Create a room or join a friend's room.
      </p>
    </section>

    <div class="scoreboard">
      <div class="player p1" id="p1card">
        <span class="name" id="p1name">You</span>
        <span class="score" id="p1score">0</span>
      </div>
      <div class="player p2" id="p2card">
        <span class="name" id="p2name">Computer</span>
        <span class="score" id="p2score">0</span>
      </div>
    </div>

    <p id="status" class="status" aria-live="polite"></p>

    <div id="board" class="board" role="grid" aria-label="Game board"></div>

    <p class="hint">Draw a line between two dots. Complete a box to claim it and take another turn.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
