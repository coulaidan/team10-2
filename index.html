<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dots &amp; Boxes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Dots &amp; Boxes</h1>

    <div class="controls">
      <label>Mode
        <select id="mode">
          <option value="cpu" selected>vs Computer</option>
          <option value="pvp">2 Players</option>
        </select>
      </label>
      <label id="difficulty-control">CPU difficulty
        <select id="difficulty">
          <option value="easy">Easy (50%)</option>
          <option value="medium" selected>Medium (75%)</option>
          <option value="hard">Hard (100%)</option>
        </select>
      </label>
      <button id="restart" type="button">New game</button>
      <button id="mute" type="button" aria-label="Play music" aria-pressed="false">
        <img id="mute-icon" src="assets/TINGMuteButton2.webp" alt="">
      </button>
    </div>

    <div class="scoreboard">
      <div class="player p1" id="p1card">
        <span class="name" id="p1name">You</span>
        <span class="score" id="p1score">0</span>
        <span class="change-colour" id="p1change">
          <input type="color" id="p1-color" value="#1769aa" aria-label="Choose your color">
        </span>
      </div>
      <div class="player p2" id="p2card">
        <span class="name" id="p2name">Computer</span>
        <span class="score" id="p2score">0</span>
        <span class="change-colour" id="p2change">
          <input type="color" id="p2-color" value="#c43b3b" aria-label="Choose opponent's color">
        </span>
      </div>
    </div>

    <p id="status" class="status" aria-live="polite"></p>

    <div id="board" class="board" role="grid" aria-label="Game board"></div>

    <p class="hint">Draw a line between two dots. Boxes are worth 1–5 points; complete one to claim its points and take another turn.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
